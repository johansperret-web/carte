<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body,#map{height:100%;margin:0}</style>
</head><body><div id="map"></div>
<script>
// emprise de ton image : [[sud, ouest], [nord, est]]
const bounds = [[44.4199524, 4.08080708], [44.4208416, 4.08403026]];
const map = L.map('map').fitBounds(bounds);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
L.imageOverlay('plantation.jpg', bounds).addTo(map);
map.locate({watch:true, enableHighAccuracy:true});
let marker;
map.on('locationfound', e => {
  if(!marker) marker = L.circleMarker(e.latlng,{radius:8,color:'#fff',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  else marker.setLatLng(e.latlng);
});
</script></body></html>
