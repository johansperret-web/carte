<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#137a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carte">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<style>
:root{--vert:#137a1e}
html,body{height:100%;margin:0;overflow:hidden;font-family:sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Bande verte du bas */
#bas{flex:0 0 auto;background:var(--vert);color:#fff;display:block;text-align:center;
  text-decoration:none;font-size:15px;
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}

/* Zone carte */
#zone{position:relative;flex:1 1 auto;min-height:0}
#map{position:absolute;inset:0;z-index:0}

/* Menu des cartes : centré en haut */
#barre{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;
  transform:translateX(-50%);z-index:1000;height:40px;box-sizing:border-box;
  background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.4);
  padding:0 8px;display:flex;align-items:center}
#choix{font:bold 15px sans-serif;border:0;background:transparent;color:#000;max-width:50vw;height:100%;
  outline:none;-webkit-tap-highlight-color:transparent}
#choix:focus,#choix:focus-visible,#choix:active{outline:none;box-shadow:none;border:0}

/* Bouton des couches : en haut à droite */
#btn-couches{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
  z-index:1000;width:40px;height:40px;border:0;border-radius:8px;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;outline:none;-webkit-tap-highlight-color:transparent}

/* Réglage d'opacité : en bas à droite */
#opacite{position:absolute;bottom:12px;right:10px;z-index:1000;display:flex;flex-direction:column;
  align-items:center;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.4);overflow:hidden}
#opacite button{width:40px;height:40px;border:0;background:#fff;font:bold 22px sans-serif;
  color:#222;cursor:pointer;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
#opacite button:active{background:#e6e6e6}
#op-val{font:bold 11px sans-serif;color:#444;padding:2px 0;border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;width:100%;text-align:center}

/* Panneau des couches (défile si la liste est longue) */
#panneau{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);right:10px;
  z-index:1100;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4);
  padding:10px 14px;font-size:14px;max-width:75vw;max-height:70vh;overflow:auto;color:#222}
#panneau.ouvert{display:block}
#panneau h4{margin:10px 0 4px;font-size:13px;color:#555}
#panneau h4:first-child{margin-top:0}
#panneau label{display:block;padding:5px 0}
#panneau label.indispo{color:#999}
#panneau .credits{margin-top:10px;padding-top:6px;border-top:1px solid #ddd;font-size:10px;color:#777;line-height:1.3}

/* Légende */
#legende{position:absolute;bottom:12px;left:10px;z-index:1000;
  background:rgba(255,255,255,.9);padding:8px 10px;border-radius:6px;font-size:12px}
#legende .nom{font-weight:bold;margin-bottom:6px}
#legende .corps{display:flex;gap:8px;align-items:stretch}
#lg-barre{width:18px;height:160px;border:1px solid #888}
#lg-vals{display:flex;flex-direction:column;justify-content:space-between}

/* Étiquettes des arbres au fort zoom */
.leaflet-tooltip.etiquette-arbre{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(0,0,0,.25);
  border-radius:4px;
  color:#111;
  font-size:11px;
  font-weight:bold;
  padding:1px 5px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  white-space:nowrap;
  pointer-events:none
}
.leaflet-tooltip.etiquette-arbre::before{display:none}
</style>
</head><body>

<div id="zone">
  <div id="map"></div>

  <div id="barre"><select id="choix"></select></div>

  <button id="btn-couches" aria-label="Couches">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#137a1e" stroke-width="2" stroke-linejoin="round">
      <path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 16l10 5 10-5"/>
    </svg>
  </button>

  <div id="opacite">
    <button id="op-plus" aria-label="Plus opaque">+</button>
    <div id="op-val">100%</div>
    <button id="op-moins" aria-label="Plus transparent">−</button>
  </div>

  <div id="panneau">
    <h4>Fond de carte</h4><div id="liste-fonds"></div>
    <h4>Éléments sur la carte</h4><div id="liste-couches"></div>
    <div class="credits">Fonds : Esri, Maxar, Earthstar Geographics · Photographies aériennes et cadastre © IGN/Géoplateforme · © OpenStreetMap contributors · Leaflet</div>
  </div>

  <div id="legende">
    <div class="nom" id="lg-nom"></div>
    <div class="corps"><div id="lg-barre"></div><div id="lg-vals"></div></div>
  </div>
</div>

<a id="bas" href="https://www.appsheet.com/start/072b8903-c281-49cd-8af6-a737949a85c4">← Retour à l'App</a>

<script>
// ================= A MODIFIER =================

// Emprise par défaut des cartes : [[sud, ouest], [nord, est]]
const bounds = [[44.41965873, 4.080807813], [44.42084133, 4.082727103]];

// Affichage des étiquettes des arbres (champ 'Identifi' du fichier arbres.dbf)
const ZOOM_MIN_ETIQUETTES = 21;
const CHAMP_NOM_ARBRE     = 'Identifi';

// Palette utilisée quand une carte n'a pas son propre "degrade"
const DEGRADE_DEFAUT = 'linear-gradient(to top,#2b83ba,#abdda4,#ffffbf,#fdae61,#d7191c)';

// Palette de la carte de pH (4 = rouge ... 9 = violet), du bas vers le haut
const DEGRADE_PH = 'linear-gradient(to top,'
  + '#ff2a1a 0%,#ff8a1a 10%,#f5e02a 20%,#d0f02a 28%,#a0dc28 32%,#5cb82e 40%,'
  + '#009a30 48%,#00a868 52%,#00c8a0 56%,#00f5ee 60%,#1ac0ff 68%,#2a8cff 80%,'
  + '#3c5cff 88%,#5018ff 100%)';
const DEGRADE_CALCIUM = 'linear-gradient(to top,'
  + '#ff2b18 0%,#fa751e 5%,#f6bf25 10%,#eefc2a 15%,#d5f22b 20%,'
  + '#bce72c 25%,#a2dd2d 30%,#89d22e 35%,#70c82f 40%,#57bd30 45%,'
  + '#3db331 50%,#24a832 55%,#0b9d33 60%,#01a44a 65%,#02b771 70%,'
  + '#04cb98 75%,#06debf 80%,#07f1e6 85%,#16d3fd 90%,#3773fc 95%,'
  + '#5813fc 100%)';

// Une ligne par carte raster (PNG transparent).
// La dernière ligne (fichier:null) sert à ne rien afficher.
const CARTES = [
  {nom:'pH',        fichier:'ph.png',        unite:'pH',                 min:4, max:9,  pas:1, degrade:DEGRADE_PH},
  {nom:'Calcium',   fichier:'calcium.png',   unite:'Calcium (cmol+/kg)', min:0, max:20, pas:5, degrade:DEGRADE_CALCIUM},
  {nom:'Potassium', fichier:'potassium.png', unite:'Potassium (mg/kg)',  min:0, max:100},
  {nom:'Magnésium', fichier:'magnesium.png', unite:'Magnésium (mg/kg)',  min:0, max:100},
  {nom:'Sans carte', fichier:null}
];

// Une ligne par shapefile (zip avec .shp .shx .dbf .prj à la racine).
// Chaque ligne apparaît avec une case à cocher dans le panneau des couches.
const VECTEURS = [
  {nom:'Terrasses', fichier:'Terrasses.zip', couleur:'#ffff00', epaisseur:2},
  {nom:'Arbres',    fichier:'arbres.zip',    couleur:'#ff0000', rayon:1}
];

// Opacité de départ des cartes (1 = pleine) et pas des boutons + / −
let opacite = 1;
const PAS_OPACITE = 0.1;

// ==============================================

// Pas de boutons de zoom : on zoome avec deux doigts (ou la molette sur ordinateur)
const map = L.map('map', {maxZoom:23, attributionControl:false, zoomControl:false}).fitBounds(bounds);

// Niveaux d'affichage : cartes de sol (250) < cadastre (300) < vecteurs (400)
map.createPane('raster');
map.getPane('raster').style.zIndex = 250;
map.createPane('cadastre');
map.getPane('cadastre').style.zIndex = 300;

// Fonds de carte
const plan = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:23, maxNativeZoom:19});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:23, maxNativeZoom:19});
const ign = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
  {maxZoom:23, maxNativeZoom:19});

sat.addTo(map);

// Photographies aériennes historiques IGN (tuiles WMTS).
// 'format' est le format demandé en premier ; si une tuile échoue,
// la page réessaie automatiquement dans l'autre format (PNG <-> JPEG).
function orthoIGN(couche, format){
  const autre = format === 'image/png' ? 'image/jpeg' : 'image/png';
  const url = fmt => 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + couche +
    '&STYLE=normal&FORMAT=' + fmt + '&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
  const lay = L.tileLayer(url(format), {maxZoom:23, maxNativeZoom:18});
  const dejaEssaye = {};
  lay.on('tileerror', e => {
    const cle = e.coords.z + '/' + e.coords.x + '/' + e.coords.y;
    if(dejaEssaye[cle]) return;
    dejaEssaye[cle] = true;
    e.tile.src = L.Util.template(url(autre), {x:e.coords.x, y:e.coords.y, z:e.coords.z});
  });
  return lay;
}

// ---- Panneau des couches ----
const panneau = document.getElementById('panneau');
document.getElementById('btn-couches').addEventListener('click', e => {
  e.stopPropagation();
  panneau.classList.toggle('ouvert');
});
map.on('click', () => panneau.classList.remove('ouvert'));

function ligne(type, name, texte, coche, onchange){
  const l = document.createElement('label');
  const i = document.createElement('input');
  i.type = type; if(name) i.name = name; i.checked = coche;
  i.addEventListener('change', () => onchange(i.checked));
  l.append(i, ' ' + texte);
  l.input = i;
  return l;
}

// Le premier de la liste est celui affiché au départ (il doit correspondre au addTo ci-dessus)
const FONDS = [
  {nom:'Satellite Esri',                 couche:sat},
  {nom:'Satellite IGN (actuel)',         couche:ign},
  {nom:'IGN 1950-1965 (noir et blanc)',  couche:orthoIGN('ORTHOIMAGERY.ORTHOPHOTOS.1950-1965', 'image/png')},
  {nom:'IGN 1980-1995', couche:orthoIGN('ORTHOIMAGERY.ORTHOPHOTOS.1980-1995', 'image/png')},
  {nom:'IGN 2000-2005',                  couche:orthoIGN('ORTHOIMAGERY.ORTHOPHOTOS2000-2005', 'image/jpeg')},
  {nom:'IGN 2006-2010',                  couche:orthoIGN('ORTHOIMAGERY.ORTHOPHOTOS2006-2010', 'image/jpeg')},
  {nom:'IGN 2011-2015',                  couche:orthoIGN('ORTHOIMAGERY.ORTHOPHOTOS2011-2015', 'image/jpeg')},
  {nom:'IGN 2016-2020',                  couche:orthoIGN('ORTHOIMAGERY.ORTHOPHOTOS2016-2020', 'image/jpeg')},
  {nom:'Plan',                           couche:plan}
];

FONDS.forEach((f, idx) => {
  document.getElementById('liste-fonds').appendChild(
    ligne('radio', 'fond', f.nom, idx === 0, c => {
      if(!c) return;
      FONDS.forEach(x => map.removeLayer(x.couche));
      f.couche.addTo(map);
      f.couche.bringToBack();
    })
  );
});

// ---- Menu déroulant des cartes ----
const select = document.getElementById('choix');
CARTES.forEach((c, i) => select.add(new Option(c.nom, i)));

let overlay = null;
function afficher(i){
  const c = CARTES[i];
  if(overlay){ map.removeLayer(overlay); overlay = null; }

  const legende = document.getElementById('legende');
  if(!c.fichier){            // "Sans carte" : rien à afficher
    legende.style.display = 'none';
    return;
  }
  legende.style.display = '';

  overlay = L.imageOverlay(c.fichier, c.bounds || bounds, {opacity:opacite, pane:'raster'}).addTo(map);

  document.getElementById('lg-nom').textContent = c.unite;
  document.getElementById('lg-barre').style.background = c.degrade || DEGRADE_DEFAUT;

  const pas = c.pas || (c.max - c.min) / 2;
  const vals = [];
  for(let v = c.max; v >= c.min - 1e-9; v -= pas) vals.push(+v.toFixed(2));
  document.getElementById('lg-vals').innerHTML = vals.map(v => '<span>' + v + '</span>').join('');
}
select.addEventListener('change', () => { afficher(select.value); select.blur(); });
afficher(0);

// ---- Boutons + / − : opacité de la carte ----
function majOpacite(){
  document.getElementById('op-val').textContent = Math.round(opacite * 100) + '%';
  if(overlay) overlay.setOpacity(opacite);
}
document.getElementById('op-plus').addEventListener('click', () => {
  opacite = Math.min(1, +(opacite + PAS_OPACITE).toFixed(2));
  majOpacite();
});
document.getElementById('op-moins').addEventListener('click', () => {
  opacite = Math.max(0.1, +(opacite - PAS_OPACITE).toFixed(2));
  majOpacite();
});
majOpacite();

// ---- Étiquettes des arbres (zoom >= ZOOM_MIN_ETIQUETTES) ----
const etiquettesArbres = L.layerGroup();
let coucheArbresRef = null;
let arbresVisibles = true;

function getNomArbre(props){
  if(!props) return '';
  if(CHAMP_NOM_ARBRE && props[CHAMP_NOM_ARBRE] != null){
    return String(props[CHAMP_NOM_ARBRE]).trim();
  }
  const candidats = ['identifi', 'nom', 'name', 'espece', 'type', 'libelle', 'label', 'id'];
  for(const cle of candidats){
    const trouve = Object.keys(props).find(k => k.toLowerCase() === cle);
    if(trouve && props[trouve] != null && String(props[trouve]).trim() !== ''){
      return String(props[trouve]).trim();
    }
  }
  const premiereValeur = Object.values(props).find(v => v != null && String(v).trim() !== '');
  return premiereValeur ? String(premiereValeur).trim() : '';
}

function majEtiquettesArbres(){
  const zoomOk = map.getZoom() >= ZOOM_MIN_ETIQUETTES;
  const afficherEtiquettes = zoomOk && arbresVisibles && coucheArbresRef && map.hasLayer(coucheArbresRef);
  if(afficherEtiquettes){
    if(!map.hasLayer(etiquettesArbres)) map.addLayer(etiquettesArbres);
  } else if(map.hasLayer(etiquettesArbres)){
    map.removeLayer(etiquettesArbres);
  }
}
map.on('zoomend', majEtiquettesArbres);

// ---- Vecteurs (shapefiles) ----
VECTEURS.forEach(v => {
  v.couche = null;
  v.visible = true;
  const estArbres = v.fichier.toLowerCase().includes('arbre');

  const l = ligne('checkbox', null, v.nom, true, on => {
    v.visible = on;
    if(v.couche) on ? map.addLayer(v.couche) : map.removeLayer(v.couche);
    if(estArbres){
      arbresVisibles = on;
      majEtiquettesArbres();
    }
  });
  document.getElementById('liste-couches').appendChild(l);

  fetch(v.fichier)
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(buf => shp(buf))
    .then(geojson => {
      const rayon = v.rayon || 5;
      if(estArbres) etiquettesArbres.clearLayers();

      v.couche = L.geoJSON(geojson, {
        style: {color: v.couleur, weight: v.epaisseur || 2, fillOpacity: 0.1},
        pointToLayer: (f, latlng) => {
          const markerPoint = L.circleMarker(latlng, {
            radius: rayon,
            color: '#fff',
            weight: rayon <= 2 ? 0 : 1,
            fillColor: v.couleur,
            fillOpacity: 1
          });
          if(estArbres){
            const nom = getNomArbre(f.properties);
            if(nom){
              etiquettesArbres.addLayer(
                L.tooltip({
                  permanent: true,
                  direction: 'top',
                  offset: [0, -4],
                  className: 'etiquette-arbre'
                }).setContent(nom).setLatLng(latlng)
              );
            }
          }
          return markerPoint;
        },
        onEachFeature: (f, layer) => {
          const p = f.properties || {};
          const texte = Object.keys(p).map(k => '<b>' + k + '</b> : ' + p[k]).join('<br>');
          if(texte) layer.bindPopup(texte);
        }
      });

      if(estArbres) coucheArbresRef = v.couche;
      if(v.visible) v.couche.addTo(map);
      if(estArbres) majEtiquettesArbres();
    })
    .catch(err => {
      console.error('Vecteur ' + v.fichier + ' : ' + err);
      l.classList.add('indispo');
      l.input.disabled = true;
      l.append(' (indisponible)');
    });
});

// ---- Cadastre IGN (parcelles), case décochée au départ ----
const cadastre = L.tileLayer.wms('https://data.geopf.fr/wms-r/wms', {
  layers: 'CADASTRALPARCELS.PARCELLAIRE_EXPRESS',
  format: 'image/png',
  transparent: true,
  version: '1.3.0',
  detectRetina: true,
  opacity: 0.8,
  maxZoom: 23,
  pane: 'cadastre'
});
document.getElementById('liste-couches').appendChild(
  ligne('checkbox', null, 'Cadastre (parcelles)', false,
    on => on ? map.addLayer(cadastre) : map.removeLayer(cadastre))
);

// ---- Décalage manuel du cadastre (en mètres) ----
// Est positif = vers la droite, Nord positif = vers le haut.
// Test sans modifier le fichier : ajoute ?ce=3&cn=-2 à l'adresse de la page.
const params = new URLSearchParams(location.search);
const DECALAGE_EST_M   = parseFloat(params.get('ce')) || 1;
const DECALAGE_NORD_M  = parseFloat(params.get('cn')) || 10;

function appliquerDecalageCadastre(){
  const lat = map.getCenter().lat;
  const mParPx = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, map.getZoom());
  const dx =  DECALAGE_EST_M  / mParPx;
  const dy = -DECALAGE_NORD_M / mParPx;
  map.getPane('cadastre').style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
map.on('zoomend moveend viewreset', appliquerDecalageCadastre);
appliquerDecalageCadastre();

// ---- Position GPS ----
map.locate({watch:true, enableHighAccuracy:true});
let marker;
map.on('locationfound', e => {
  if(!marker) marker = L.circleMarker(e.latlng,{radius:8,color:'#fff',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  else marker.setLatLng(e.latlng);
});
</script>
</body></html>
