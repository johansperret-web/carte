<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4@2.9.2/dist/proj4.js"></script>
<script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/georaster-layer-for-leaflet@3.10.0/dist/v3/webpack/bundle/georaster-layer-for-leaflet.min.js"></script>
<style>
html,body,#map{height:100%;margin:0}
#msg{position:absolute;top:10px;left:50px;right:10px;z-index:1000;background:#fff;padding:8px;border-radius:6px;font:14px sans-serif}
</style>
</head><body><div id="map"></div><div id="msg">Chargement…</div>
<script>
const msg = document.getElementById('msg');
const map = L.map('map').setView([44.420066, 4.081510], 18);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

fetch('plantation.tiff')
  .then(r => { if(!r.ok) throw new Error('Fichier introuvable (HTTP ' + r.status + ')'); return r.arrayBuffer(); })
  .then(buf => parseGeoraster(buf))
  .then(g => {
    msg.textContent = 'OK : projection ' + g.projection + ', ' + g.numberOfRasters + ' bande(s), ' + g.width + 'x' + g.height + ' px';
    const layer = new GeoRasterLayer({georaster: g, opacity: 1, resolution: 256});
    layer.addTo(map);
    map.fitBounds(layer.getBounds());
  })
  .catch(err => { msg.textContent = 'Erreur : ' + err.message; });

map.locate({watch:true, enableHighAccuracy:true});
let marker;
map.on('locationfound', e => {
  if(!marker) marker = L.circleMarker(e.latlng,{radius:8,color:'#fff',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  else marker.setLatLng(e.latlng);
});
</script></body></html>
