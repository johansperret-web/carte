<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@4.1.0/dist/v3/webpack/bundle/georaster-layer-for-leaflet.min.js"></script>
<style>html,body,#map{height:100%;margin:0}</style>
</head><body><div id="map"></div>
<script>
const map = L.map('map').setView([44.420066, 4.081510], 18);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

fetch('plantation.tiff')
  .then(r => r.arrayBuffer())
  .then(buf => parseGeoraster(buf))
  .then(georaster => {
    const layer = new GeoRasterLayer({georaster, opacity: 1, resolution: 256});
    layer.addTo(map);
    map.fitBounds(layer.getBounds());
  });

map.locate({watch:true, enableHighAccuracy:true});
let marker;
map.on('locationfound', e => {
  if(!marker) marker = L.circleMarker(e.latlng,{radius:8,color:'#fff',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  else marker.setLatLng(e.latlng);
});
</script></body></html>
