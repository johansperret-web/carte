<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<style>
:root{--vert:#137a1e}
html,body{height:100%;margin:0;overflow:hidden;font-family:sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Bandes vertes */
#haut,#bas{flex:0 0 auto;background:var(--vert);color:#fff}
#haut{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px}
#bas{display:block;text-align:center;text-decoration:none;font-size:20px;
  padding:12px 8px calc(env(safe-area-inset-bottom,0px) + 12px)}

/* Menu des cartes */
#choix{width:100%;background:transparent;color:#fff;border:0;font:bold 20px sans-serif;
  text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;
  padding:6px 24px 6px 6px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='white' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center}
#choix option{color:#000;font-size:16px}

/* Bouton couches */
#btn-couches{width:40px;height:40px;border:0;border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

/* Zone carte */
#zone{position:relative;flex:1 1 auto;min-height:0}
#map{position:absolute;inset:0;z-index:0}

/* Panneau des couches */
#panneau{display:none;position:absolute;top:8px;right:8px;z-index:1100;background:#fff;
  border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:10px 14px;font-size:14px;
  max-width:75vw;color:#222}
#panneau.ouvert{display:block}
#panneau h4{margin:8px 0 4px;font-size:13px;color:#555}
#panneau h4:first-child{margin-top:0}
#panneau label{display:block;padding:4px 0}
#panneau .credits{margin-top:10px;padding-top:6px;border-top:1px solid #ddd;font-size:10px;color:#777;line-height:1.3}

/* Légende */
#legende{position:absolute;bottom:12px;left:10px;z-index:1000;
  background:rgba(255,255,255,.9);padding:8px 10px;border-radius:6px;font-size:12px}
#legende .nom{font-weight:bold;margin-bottom:6px}
#legende .corps{display:flex;gap:8px;align-items:stretch}
#lg-barre{width:18px;height:160px;border:1px solid #888}
#lg-vals{display:flex;flex-direction:column;justify-content:space-between}
</style>
</head><body>

<div id="haut">
  <div></div>
  <select id="choix"></select>
  <button id="btn-couches" aria-label="Couches">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#137a1e" stroke-width="2" stroke-linejoin="round">
      <path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 16l10 5 10-5"/>
    </svg>
  </button>
</div>

<div id="zone">
  <div id="map"></div>
  <div id="panneau">
    <h4>Fond de carte</h4><div id="liste-fonds"></div>
    <h4>Couches</h4><div id="liste-couches"></div>
    <div class="credits">Fonds : Esri, Maxar, Earthstar Geographics · © OpenStreetMap contributors · Leaflet</div>
  </div>
  <div id="legende">
    <div class="nom" id="lg-nom"></div>
    <div class="corps"><div id="lg-barre"></div><div id="lg-vals"></div></div>
  </div>
</div>

<a id="bas" href="https://www.appsheet.com/start/TON-ID-APP">← Retour à l'App</a>
