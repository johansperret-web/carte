<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<style>
html,body,#map{height:100%;margin:0}
#barre{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(255,255,255,.95);padding:6px 10px;border-radius:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.4);font:14px sans-serif}
#choix{font:bold 15px sans-serif;padding:4px;border:0;background:transparent;max-width:55vw}
#retour{position:absolute;top:60px;left:10px;z-index:1000;background:#fff;border-radius:6px;
  padding:8px 12px;font:bold 14px sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.4);
  text-decoration:none;color:#000}
#legende{position:absolute;bottom:30px;left:10px;z-index:1000;
  background:rgba(255,255,255,.9);padding:8px 10px;border-radius:6px;font:12px sans-serif}
#legende .nom{font-weight:bold;margin-bottom:6px}
#legende .corps{display:flex;gap:8px;align-items:stretch}
#lg-barre{width:18px;height:160px;border:1px solid #888}
#lg-vals{display:flex;flex-direction:column;justify-content:space-between}
</style>
</head><body>
<div id="map"></div>
<div id="barre"><select id="choix"></select></div>
<a id="retour" href="https://www.appsheet.com/start/TON-ID-APP">← Retour à l'app</a>
<div id="legende">
  <div class="nom" id="lg-nom"></div>
  <div class="corps">
    <div id="lg-barre"></div>
    <div id="lg-vals"></div>
  </div>
</div>

<script>
// ================= A MODIFIER =================

// Emprise par défaut des cartes : [[sud, ouest], [nord, est]]
const bounds = [[44.41965873, 4.080807813], [44.42084133, 4.082727103]];

// Palette utilisée quand une carte n'a pas son propre "degrade"
const DEGRADE_DEFAUT = 'linear-gradient(to top,#2b83ba,#abdda4,#ffffbf,#fdae61,#d7191c)';

// Palette de la carte de pH (4 = rouge ... 9 = violet), du bas vers le haut
const DEGRADE_PH = 'linear-gradient(to top,'
  + '#ff2a1a 0%,#ff8a1a 10%,#f5e02a 20%,#d0f02a 28%,#a0dc28 32%,#5cb82e 40%,'
  + '#009a30 48%,#00a868 52%,#00c8a0 56%,#00f5ee 60%,#1ac0ff 68%,#2a8cff 80%,'
  + '#3c5cff 88%,#5018ff 100%)';

// Une ligne par carte raster (PNG transparent).
// pas = écart entre graduations (facultatif), degrade = couleurs (facultatif),
// bounds = emprise propre à la carte (facultatif).
const CARTES = [
  {nom:'pH',        fichier:'pH.png',        unite:'pH',                min:4, max:9, pas:1, degrade:DEGRADE_PH},
  {nom:'Calcium',   fichier:'calcium.png',   unite:'Calcium (mg/kg)',   min:0, max:100},
  {nom:'Potassium', fichier:'potassium.png', unite:'Potassium (mg/kg)', min:0, max:100},
  {nom:'Magnésium', fichier:'magnesium.png', unite:'Magnésium (mg/kg)', min:0, max:100}
];

// Une ligne par shapefile (zip avec .shp .shx .dbf .prj à la racine).
// Supprime les lignes dont tu n'as pas encore les fichiers.
const VECTEURS = [
  {nom:'Terrasses', fichier:'terrasses.zip', couleur:'#ffff00', epaisseur:2},
  {nom:'Arbres',    fichier:'arbres.zip',    couleur:'#ff00ff', rayon:4}
];

// ==============================================

const map = L.map('map', {maxZoom: 23}).fitBounds(bounds);

map.createPane('raster');
map.getPane('raster').style.zIndex = 250;

const plan = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:23, maxNativeZoom:19, attribution:'© OpenStreetMap'});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:23, maxNativeZoom:19, attribution:'Esri, Maxar, Earthstar Geographics'});
sat.addTo(map);

const controle = L.control.layers({'Satellite':sat, 'Plan':plan}, null,
  {position:'topright', collapsed:true}).addTo(map);

const select = document.getElementById('choix');
CARTES.forEach((c, i) => select.add(new Option(c.nom, i)));

let overlay = null;
function afficher(i){
  const c = CARTES[i];
  if(overlay) map.removeLayer(overlay);
  overlay = L.imageOverlay(c.fichier, c.bounds || bounds, {opacity:1, pane:'raster'}).addTo(map);

  document.getElementById('lg-nom').textContent = c.unite;
  document.getElementById('lg-barre').style.background = c.degrade || DEGRADE_DEFAUT;

  const pas = c.pas || (c.max - c.min) / 2;
  const vals = [];
  for(let v = c.max; v >= c.min - 1e-9; v -= pas) vals.push(+v.toFixed(2));
  document.getElementById('lg-vals').innerHTML = vals.map(v => '<span>' + v + '</span>').join('');
}
select.addEventListener('change', () => afficher(select.value));
afficher(0);

VECTEURS.forEach(v => {
  fetch(v.fichier)
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(buf => shp(buf))
    .then(geojson => {
      const couche = L.geoJSON(geojson, {
        style: {color: v.couleur, weight: v.epaisseur || 2, fillOpacity: 0.1},
        pointToLayer: (f, latlng) => L.circleMarker(latlng,
          {radius: v.rayon || 5, color: '#fff', weight: 1, fillColor: v.couleur, fillOpacity: 1}),
        onEachFeature: (f, layer) => {
          const p = f.properties || {};
          const texte = Object.keys(p).map(k => '<b>' + k + '</b> : ' + p[k]).join('<br>');
          if(texte) layer.bindPopup(texte);
        }
      }).addTo(map);
      controle.addOverlay(couche, v.nom);
    })
    .catch(err => console.error('Vecteur ' + v.fichier + ' : ' + err));
});
map.locate({watch:true, enableHighAccuracy:true});
let marker;
map.on('locationfound', e => {
  if(!marker) marker = L.circleMarker(e.latlng,{radius:8,color:'#fff',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  else marker.setLatLng(e.latlng);
});
</script>
</body></html>
